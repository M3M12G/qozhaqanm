<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Её вселенная</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Marck+Script&family=Noto+Serif:ital,wght@0,500;0,600;1,500&display=swap');

  :root{
    --plum: #2b1420;
    --plum-soft: #3f1f2e;
    --blush: #f8dfe8;
    --blush-2: #f3c9da;
    --rose: #c9628b;
    --rose-deep: #a94870;
    --gold: #d3ac6e;
    --gold-soft: #e8d3a6;
    --cream: #fdf3ef;
    --ink: #2b1420;
    --font-script: 'Marck Script', 'Cormorant Garamond', cursive;
    --font-display: 'Cormorant Garamond', 'Noto Serif', Georgia, serif;
    --font-ui: 'Manrope', sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--plum-soft), var(--plum) 70%);
    font-family: var(--font-ui);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  body{
    position:fixed;
    inset:0;
    min-height:100dvh;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .petal-float{
    position:absolute;
    width:14px; height:14px;
    background: linear-gradient(135deg, var(--blush-2), var(--rose));
    border-radius: 50% 50% 50% 50% / 78% 78% 22% 22%;
    opacity:0.35;
    animation: drift 18s linear infinite;
    pointer-events:none;
  }
  .heart-float{
    position:absolute;
    font-size: 14px;
    color: var(--gold-soft);
    opacity:0;
    pointer-events:none;
    animation: heartDrift 16s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(211,172,110,0.35);
  }

  @keyframes drift{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.25; }
    100%{ transform: translateY(110vh) rotate(360deg); opacity:0; }
  }
  @keyframes heartDrift{
    0%{ transform: translateY(105%) scale(0.7) rotate(-8deg); opacity:0; }
    12%{ opacity:0.45; }
    50%{ transform: translateY(40%) scale(1) rotate(8deg); opacity:0.35; }
    100%{ transform: translateY(-20%) scale(0.8) rotate(-6deg); opacity:0; }
  }
  @keyframes titleIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: none; }
  }
  @keyframes lineIn{
    from{ opacity:0; transform: scaleX(0.3); }
    to{ opacity:1; transform: none; }
  }
  @keyframes bloom{
    from{
      opacity:0;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.2);
    }
    to{
      opacity:1;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1);
    }
  }
  @keyframes centerIn{
    from{ opacity:0; transform: translate(-50%, -50%) scale(0.65); }
    to{ opacity:1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes heartbeat{
    0%, 28%, 70%, 100%{ transform: scale(1); }
    14%{ transform: scale(1.22); }
    42%{ transform: scale(1.12); }
  }
  @keyframes ringPulse{
    0%{ transform: scale(1); opacity:0.55; }
    100%{ transform: scale(1.38); opacity:0; }
  }
  @keyframes chipIn{
    from{ opacity:0; transform: translateY(10px) scale(0.96); }
    to{ opacity:1; transform: none; }
  }

  .title-wrap{
    position:absolute;
    top:6%; left:50%; transform:translateX(-50%);
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .title-wrap h1{
    font-family: var(--font-script);
    font-weight:400;
    font-style:normal;
    font-size: clamp(34px, 7vw, 58px);
    line-height:1.15;
    margin:0;
    letter-spacing:0.5px;
    color: var(--cream);
    text-shadow: 0 2px 24px rgba(169,72,112,0.35);
    padding-bottom: 8px;
    animation: titleIn 1.1s var(--ease-out) both;
  }
  .title-wrap h1::after{
    content:'';
    display:block;
    width:48px;
    height:1px;
    margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: lineIn 1.2s var(--ease-out) 0.45s both;
  }

  .flower{
    position:relative;
    width: min(70vh, 640px);
    height: min(70vh, 640px);
  }

  .petal{
    --rot: 0deg;
    --x: 0%;
    --y: 0%;
    position:absolute;
    top: calc(50% + var(--y));
    left: calc(50% + var(--x));
    width: 30%;
    height: 30%;
    margin:0;
    border: none;
    cursor:pointer;
    border-radius: 0 46% 46% 46%;
    display:flex;
    align-items:center; justify-content:center;
    transform: translate(-50%, -50%) rotate(var(--rot));
    transition: transform .45s var(--ease-out), filter .35s ease;
    padding: 8px;
    -webkit-tap-highlight-color: transparent;
    appearance:none;
    -webkit-appearance:none;
    animation: bloom 0.9s var(--ease-out) calc(0.42s + var(--i, 0) * 0.09s) both;
  }
  .petal:focus-visible{ outline: 3px solid var(--gold); outline-offset: 4px; }
  .petal:active{ filter: brightness(1.1); }

  @media (hover: hover) and (pointer: fine){
    .petal:hover{
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.08);
      filter: brightness(1.08);
      z-index:3;
    }
  }

  .petal-inner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    transform: rotate(calc(var(--rot) * -1));
  }
  .petal-inner .emoji{ font-size: clamp(18px, 4.6vw, 30px); line-height:1; }
  .petal-inner .label{
    font-family: var(--font-ui);
    font-weight:600;
    font-size: clamp(10px, 1.7vw, 13.5px);
    color: var(--ink);
    text-align:center;
    max-width: 9.5em;
    line-height:1.2;
  }

  .center-node{
    position:absolute; top:50%; left:50%;
    width:28%; height:28%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a2438, var(--plum) 75%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 8px rgba(211,172,110,0.12), 0 10px 40px rgba(43,20,32,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:4;
    transform: translate(-50%, -50%);
    padding: 8px;
    animation: centerIn 0.95s var(--ease-out) 0.12s both;
  }
  .center-node::after{
    content:'';
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border: 1px solid rgba(211,172,110,0.45);
    pointer-events:none;
    animation: ringPulse 3.4s ease-out 1.15s infinite;
  }
  .center-node .center-text{
    text-align:center;
    position:relative;
    z-index:1;
  }
  .center-node .heart{
    font-size: clamp(16px, 3.2vw, 26px);
    margin-bottom:4px;
    display:inline-block;
    color: #f3c9da;
    animation: heartbeat 2.6s ease-in-out 1.1s infinite;
    transform-origin:center;
  }
  .center-node .center-label{
    font-family: var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size: clamp(13px, 2.4vw, 19px);
    line-height:1.2;
    padding-bottom: 2px;
    color: var(--gold-soft);
  }

  .overlay{
    position:fixed; inset:0;
    background: rgba(20,8,15,0.55);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .45s var(--ease-out);
    z-index:20;
    padding-top: env(safe-area-inset-top);
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .panel{
    width:min(880px, 100%);
    max-height: min(82dvh, calc(100dvh - env(safe-area-inset-top) - 16px));
    background: linear-gradient(180deg, var(--cream), #fbe9ee 100%);
    border-radius: 28px 28px 0 0;
    padding: 12px 40px calc(32px + env(safe-area-inset-bottom)) 40px;
    color: var(--ink);
    transform: translateY(30px);
    transition: transform .5s var(--ease-out);
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    box-shadow: 0 -10px 50px rgba(0,0,0,0.4);
  }
  .overlay.open .panel{ transform: translateY(0); }

  .panel-handle{
    display:none;
    width:40px; height:4px;
    border-radius:99px;
    background: rgba(169,72,112,0.28);
    margin: 4px auto 16px;
  }

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(169,72,112,0.25);
    padding-bottom: 14px;
  }
  .panel-head .htitle{
    font-family: var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size: clamp(20px, 3.4vw, 30px);
    line-height:1.25;
    color: var(--rose-deep);
    display:flex; align-items:center; gap:12px;
    min-width:0;
    padding-bottom: 2px;
  }
  .panel-head .htitle .em{ font-size: clamp(22px, 4vw, 30px); flex-shrink:0; }
  #panelTitle{ overflow-wrap:anywhere; }

  .close-btn{
    width:44px; height:44px;
    flex-shrink:0;
    border-radius:50%;
    border:1px solid var(--rose-deep);
    background:transparent;
    color:var(--rose-deep);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .close-btn:hover{ background:var(--rose-deep); color:var(--cream); }

  .chip-grid{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    background: #ffffff;
    border: 1px solid rgba(169,72,112,0.2);
    padding: 9px 16px;
    border-radius: 999px;
    font-family: var(--font-ui);
    font-size: 14.5px;
    font-weight:600;
    color: var(--ink);
    max-width: 100%;
    line-height:1.3;
    animation: chipIn 0.5s var(--ease-out) calc(var(--i, 0) * 45ms) both;
  }
  .chip .em{ font-size:17px; flex-shrink:0; }
  .chip.special{
    background: linear-gradient(90deg, var(--gold-soft), #f6e6c8);
    border-color: var(--gold);
    color: #5a4420;
  }

  .note{
    margin-top:18px;
    font-family: var(--font-display);
    font-size:15px;
    color: #7a4a5c;
    font-style:italic;
    line-height:1.4;
    animation: chipIn 0.5s var(--ease-out) 0.2s both;
  }

  @media (max-width: 720px){
    .stage{
      flex-direction:column;
      justify-content:flex-start;
    }
    .title-wrap{
      position:relative;
      top:auto; left:auto;
      transform:none;
      flex-shrink:0;
      margin-top: 4px;
      margin-bottom: 6px;
    }
    .flower{
      width: min(84vw, calc(100dvh - 8.8rem));
      height: min(84vw, calc(100dvh - 8.8rem));
      margin: auto 0;
      flex-shrink:0;
    }
    .petal{
      width: 30%;
      height: 30%;
      border-radius: 0 40% 40% 40%;
      padding: 6px;
    }
    .petal-inner{ gap:4px; }
    .petal-inner .emoji{ font-size: 20px; }
    .petal-inner .label{ max-width: 7.8em; font-size: 11.5px; }
    .center-node{
      width: 30%;
      height: 30%;
      box-shadow: 0 0 0 5px rgba(211,172,110,0.12), 0 8px 28px rgba(0,0,0,0.4);
    }
    .panel-handle{ display:block; }
    .panel{
      width:100%;
      border-radius: 24px 24px 0 0;
      padding: 8px 18px calc(28px + env(safe-area-inset-bottom)) 18px;
      max-height: min(86dvh, calc(100dvh - env(safe-area-inset-top) - 12px));
    }
    .chip-grid{ gap:8px; }
    .chip{
      font-size:13.5px;
      padding: 9px 13px;
      border-radius: 18px;
    }
  }

  @media (max-height: 520px){
    .stage{
      flex-direction:column;
      justify-content:flex-start;
    }
    .title-wrap{
      position:relative;
      top:auto; left:auto;
      transform:none;
      margin-bottom: 4px;
    }
    .title-wrap h1{ font-size: 28px; }
    .flower{
      width: min(58dvh, 52vw);
      height: min(58dvh, 52vw);
      margin: auto 0;
    }
    .petal-inner .label{ display:none; }
    .petal-inner .emoji{ font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .petal-float, .heart-float,
    .petal, .center-node, .center-node::after, .center-node .heart,
    .title-wrap h1, .title-wrap h1::after,
    .chip, .note{
      animation:none !important;
    }
    .petal, .panel, .overlay, .center-node{ transition:none; }
    .petal{ opacity:1; transform: translate(-50%, -50%) rotate(var(--rot)); }
    .center-node{ opacity:1; transform: translate(-50%, -50%); }
    .heart-float{ display:none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="title-wrap">
    <h1>Её вселенная</h1>
  </div>

  <div class="flower" id="flower">
    <div class="center-node">
      <div class="center-text">
        <div class="heart">❤</div>
        <div class="center-label">Менің<br>Қошақанм</div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-handle" aria-hidden="true"></div>
    <div class="panel-head">
      <div class="htitle"><span class="em" id="panelEmoji">🌸</span><span id="panelTitle">Категория</span></div>
      <button class="close-btn" id="closeBtn" aria-label="Закрыть">✕</button>
    </div>
    <div class="chip-grid" id="chipGrid"></div>
    <div class="note" id="panelNote"></div>
  </div>
</div>

<script>
const petalColors = ['#f6c9dd','#f3d6e6','#eec7d8','#f1cfe2','#f8d9ea','#ecc3d6'];

const categories = [
  {
    emoji:'🎀', title:'Чем любит заниматься',
    items:[
      ['😴','поспать'], ['🚶‍♀️','гулять'], ['🎬','дорамы и мультики'],
      ['💎','алмазная мозаика'], ['🎨','картины по номерам'], ['📸','фото и видео'],
      ['📱','тикток (смотреть/вести)'], ['☕','быть бариста, варить кофе'],
      ['🩰','танцы, мечтала о балете'], ['🇨🇳','учить языки (сейчас китайский)'],
      ['🥊','бокс'], ['✈️','путешествовать'], ['🚗','водить машину']
    ],
    note:'Уже была: Египет, Таиланд, Дубай, Турция.'
  },
  {
    emoji:'🍽️', title:'Любимая еда',
    items:[
      ['🍗','курица с рисом'], ['🍲','том-ям'], ['🇰🇷','корейская кухня'],
      ['🍣','суши-торт'], ['🥬','голубцы'], ['🟡','M&M’s жёлтые'],
      ['🍫','Milky Way / Snickers / Twix / KitKat (мини)'], ['🥛','Kinder молочный ломтик'],
      ['🥚','Kinder сюрприз'], ['🍘','Агуша, хлебцы'],
      ['🍬','мармелад Fruittella, Haribo, Chupa Chups (редко)'], ['🧂','солёный мармелад — чаще всего']
    ],
    note:'Не любит: фарш, жирное, кока-колу.'
  },
  {
    emoji:'💌', title:'Романтика для неё',
    items:[
      ['💬','слова'], ['💐','цветы'], ['✉️','персональные подарки — открытки, письма'],
      ['🖼️','музеи и выставки вместе'], ['🏺','гончарное дело']
    ],
    note:''
  },
  {
    emoji:'🗺️', title:'Мечтает посетить',
    items:[
      ['🇨🇳','Китай'], ['🏝️','Мальдивы'], ['⛰️','Грузия']
    ],
    note:''
  },
  {
    emoji:'🌸', title:'Любимые цветы',
    items:[
      ['🌹','кустовые розы — особенно'], ['🌷','ранункулюс'], ['🌸','пионы'],
      ['🌿','гипсофила'], ['🌺','гортензия'], ['🌼','ромашки'],
      ['🌷','тюльпаны'], ['🪷','лотосы'], ['🌹','розы Джульетта'],
      ['🌾','эустома'], ['🌸','каллы'], ['⚜️','лилии']
    ],
    note:''
  },
  {
    emoji:'✨', title:'Особенное',
    items:[
      ['💜','ARMY — фанат BTS'], ['👗','роскошные платья'], ['🔢','нумерология'],
      ['💛','золотые украшения'], ['🧴','продукция Atomy']
    ],
    note:''
  }
];

const flower = document.getElementById('flower');
const n = categories.length;
const radiusPct = 27;

categories.forEach((cat, i)=>{
  const angle = (-90 + i * (360/n)) * Math.PI/180;
  const rot = i * (360/n);

  const btn = document.createElement('button');
  btn.className = 'petal';
  btn.style.setProperty('--x', `${(Math.cos(angle) * radiusPct).toFixed(2)}%`);
  btn.style.setProperty('--y', `${(Math.sin(angle) * radiusPct).toFixed(2)}%`);
  btn.style.setProperty('--rot', `${rot}deg`);
  btn.style.setProperty('--i', i);
  btn.style.background = `linear-gradient(135deg, ${petalColors[i % petalColors.length]}, #ffffff)`;
  btn.setAttribute('aria-label', cat.title);

  const inner = document.createElement('div');
  inner.className = 'petal-inner';
  inner.innerHTML = `<div class="emoji">${cat.emoji}</div><div class="label">${cat.title}</div>`;
  btn.appendChild(inner);

  btn.addEventListener('click', ()=> openPanel(cat));
  flower.appendChild(btn);
});

const stage = document.getElementById('stage');
for(let i=0;i<7;i++){
  const p = document.createElement('div');
  p.className = 'petal-float';
  p.style.left = (8 + Math.random()*84) + '%';
  p.style.animationDelay = (Math.random()*18) + 's';
  p.style.animationDuration = (14 + Math.random()*10) + 's';
  stage.appendChild(p);
}
['♡','❤','♡','♡','❤'].forEach((mark, i)=>{
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.textContent = mark;
  h.style.left = (12 + i * 18 + Math.random()*8) + '%';
  h.style.fontSize = (11 + Math.random()*8) + 'px';
  h.style.animationDelay = (i * 2.4 + Math.random()) + 's';
  h.style.animationDuration = (14 + Math.random()*8) + 's';
  stage.appendChild(h);
});

const overlay = document.getElementById('overlay');
const panelEmoji = document.getElementById('panelEmoji');
const panelTitle = document.getElementById('panelTitle');
const chipGrid = document.getElementById('chipGrid');
const panelNote = document.getElementById('panelNote');
const closeBtn = document.getElementById('closeBtn');

function openPanel(cat){
  panelEmoji.textContent = cat.emoji;
  panelTitle.textContent = cat.title;
  chipGrid.replaceChildren();
  cat.items.forEach(([em, label], i)=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.setProperty('--i', i);
    const emEl = document.createElement('span');
    emEl.className = 'em';
    emEl.textContent = em;
    const labelEl = document.createElement('span');
    labelEl.textContent = label;
    chip.append(emEl, labelEl);
    chipGrid.appendChild(chip);
  });
  panelNote.textContent = cat.note || '';
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  closeBtn.focus();
}

function closePanel(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
}

closeBtn.addEventListener('click', closePanel);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closePanel(); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePanel(); });
</script>

</body>
</html>
