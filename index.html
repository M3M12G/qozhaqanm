<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Её вселенная</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Marck+Script&family=Noto+Serif:ital,wght@0,500;0,600;1,500&display=swap');

  :root{
    --plum: #2b1420;
    --plum-soft: #3f1f2e;
    --blush: #f8dfe8;
    --blush-2: #f3c9da;
    --rose: #c9628b;
    --rose-deep: #a94870;
    --gold: #d3ac6e;
    --gold-soft: #e8d3a6;
    --cream: #fdf3ef;
    --ink: #2b1420;
    --font-script: 'Marck Script', 'Cormorant Garamond', cursive;
    --font-display: 'Cormorant Garamond', 'Noto Serif', Georgia, serif;
    --font-ui: 'Manrope', sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--plum-soft), var(--plum) 70%);
    font-family: var(--font-ui);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
  }
  body{
    position:fixed;
    inset:0;
    min-height:100dvh;
  }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .petal-float{
    position:absolute;
    width:14px; height:14px;
    background: linear-gradient(135deg, var(--blush-2), var(--rose));
    border-radius: 50% 50% 50% 50% / 78% 78% 22% 22%;
    opacity:0.35;
    animation: drift 18s linear infinite;
    pointer-events:none;
  }
  .heart-float{
    position:absolute;
    font-size: 14px;
    color: var(--gold-soft);
    opacity:0;
    pointer-events:none;
    animation: heartDrift 16s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(211,172,110,0.35);
  }

  @keyframes drift{
    0%{ transform: translateY(-10vh) rotate(0deg); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.25; }
    100%{ transform: translateY(110vh) rotate(360deg); opacity:0; }
  }
  @keyframes heartDrift{
    0%{ transform: translateY(105%) scale(0.7) rotate(-8deg); opacity:0; }
    12%{ opacity:0.45; }
    50%{ transform: translateY(40%) scale(1) rotate(8deg); opacity:0.35; }
    100%{ transform: translateY(-20%) scale(0.8) rotate(-6deg); opacity:0; }
  }
  @keyframes titleIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: none; }
  }
  @keyframes lineIn{
    from{ opacity:0; transform: scaleX(0.3); }
    to{ opacity:1; transform: none; }
  }
  @keyframes bloom{
    from{
      opacity:0;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(0.2);
    }
    to{
      opacity:1;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1);
    }
  }
  @keyframes centerIn{
    from{ opacity:0; transform: translate(-50%, -50%) scale(0.65); }
    to{ opacity:1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes heartbeat{
    0%, 28%, 70%, 100%{ transform: scale(1); }
    14%{ transform: scale(1.22); }
    42%{ transform: scale(1.12); }
  }
  @keyframes ringPulse{
    0%{ transform: scale(1); opacity:0.55; }
    100%{ transform: scale(1.38); opacity:0; }
  }

  .title-wrap{
    position:absolute;
    top:6%; left:50%; transform:translateX(-50%);
    text-align:center;
    z-index:5;
    pointer-events:none;
  }
  .title-wrap h1{
    font-family: var(--font-script);
    font-weight:400;
    font-style:normal;
    font-size: clamp(34px, 7vw, 58px);
    line-height:1.15;
    margin:0;
    letter-spacing:0.5px;
    color: var(--cream);
    text-shadow: 0 2px 24px rgba(169,72,112,0.35);
    padding-bottom: 8px;
    animation: titleIn 1.1s var(--ease-out) both;
  }
  .title-wrap h1::after{
    content:'';
    display:block;
    width:48px;
    height:1px;
    margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: lineIn 1.2s var(--ease-out) 0.45s both;
  }
  .title-hint{
    margin: 10px 0 0;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-soft);
    opacity: 0.72;
    animation: titleIn 1.1s var(--ease-out) 0.55s both;
  }

  .flower{
    position:relative;
    width: min(70vh, 640px);
    height: min(70vh, 640px);
  }

  .petal{
    --rot: 0deg;
    --x: 0%;
    --y: 0%;
    position:absolute;
    top: calc(50% + var(--y));
    left: calc(50% + var(--x));
    width: 30%;
    height: 30%;
    margin:0;
    border: none;
    cursor:pointer;
    border-radius: 0 46% 46% 46%;
    display:flex;
    align-items:center; justify-content:center;
    transform: translate(-50%, -50%) rotate(var(--rot));
    transition: transform .45s var(--ease-out), filter .35s ease;
    padding: 8px;
    -webkit-tap-highlight-color: transparent;
    appearance:none;
    -webkit-appearance:none;
    animation: bloom 0.9s var(--ease-out) calc(0.42s + var(--i, 0) * 0.09s) both;
  }
  .petal:focus-visible{ outline: 3px solid var(--gold); outline-offset: 4px; }
  .petal:active{ filter: brightness(1.1); }

  @media (hover: hover) and (pointer: fine){
    .petal:hover{
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.08);
      filter: brightness(1.08);
      z-index:3;
    }
  }

  .petal-inner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    transform: rotate(calc(var(--rot) * -1));
  }
  .petal-inner .emoji{ font-size: clamp(18px, 4.6vw, 30px); line-height:1; }
  .petal-inner .label{
    font-family: var(--font-ui);
    font-weight:600;
    font-size: clamp(10px, 1.7vw, 13.5px);
    color: var(--ink);
    text-align:center;
    max-width: 9.5em;
    line-height:1.2;
  }

  .center-node{
    position:absolute; top:50%; left:50%;
    width:28%; height:28%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #4a2438, var(--plum) 75%);
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 8px rgba(211,172,110,0.12), 0 10px 40px rgba(43,20,32,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:4;
    transform: translate(-50%, -50%);
    padding: 8px;
    animation: centerIn 0.95s var(--ease-out) 0.12s both;
  }
  .center-node::after{
    content:'';
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border: 1px solid rgba(211,172,110,0.45);
    pointer-events:none;
    animation: ringPulse 3.4s ease-out 1.15s infinite;
  }
  .center-node .center-text{
    text-align:center;
    position:relative;
    z-index:1;
  }
  .center-node .heart{
    font-size: clamp(16px, 3.2vw, 26px);
    margin-bottom:4px;
    display:inline-block;
    color: #f3c9da;
    animation: heartbeat 2.6s ease-in-out 1.1s infinite;
    transform-origin:center;
  }
  .center-node .center-label{
    font-family: var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size: clamp(13px, 2.4vw, 19px);
    line-height:1.2;
    padding-bottom: 2px;
    color: var(--gold-soft);
  }

  .stories{
    position:fixed; inset:0;
    z-index:30;
    display:flex;
    align-items:stretch;
    justify-content:center;
    background: rgba(12,4,8,0.55);
    opacity:0;
    pointer-events:none;
    transition: opacity .45s var(--ease-out);
  }
  .stories.open{
    opacity:1;
    pointer-events:auto;
  }
  .stories-frame{
    position:relative;
    width:100%;
    height:100%;
    background:#14080e;
    overflow:hidden;
    isolation:isolate;
    touch-action:none;
  }

  .stories-progress{
    position:absolute;
    top:0; left:0; right:0;
    z-index:6;
    display:flex;
    gap:3px;
    padding: calc(10px + env(safe-area-inset-top)) 10px 0;
  }
  .seg{
    flex:1;
    height:2.5px;
    border-radius:99px;
    background: rgba(253,243,239,0.28);
    overflow:hidden;
    min-width:0;
  }
  .seg .fill{
    height:100%;
    width:100%;
    background: var(--gold-soft);
    transform: scaleX(0);
    transform-origin: left center;
    border-radius:inherit;
  }
  .seg.done .fill{ transform: scaleX(1); animation:none; }
  .seg.active .fill{
    animation: storyFill var(--dur, 5.5s) linear forwards;
  }
  .stories.paused .seg.active .fill{
    animation-play-state: paused;
  }
  @keyframes storyFill{
    from{ transform: scaleX(0); }
    to{ transform: scaleX(1); }
  }

  .stories-head{
    position:absolute;
    top: calc(16px + env(safe-area-inset-top));
    left:0; right:0;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding: 10px 10px 0 14px;
  }
  .stories-who{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    color: var(--cream);
    font-family: var(--font-ui);
    font-size:13px;
    font-weight:600;
    text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  }
  .stories-who .em{ font-size:16px; flex-shrink:0; }
  .stories-who .name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stories-close{
    width:44px; height:44px;
    flex-shrink:0;
    border:0;
    background: rgba(20,8,15,0.38);
    color: var(--cream);
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  .stories-close:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .stories-media{
    position:absolute; inset:0;
    background:#14080e;
    contain:paint;
  }
  .stories-media img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center;
    opacity:0;
    transition: opacity .55s ease;
    will-change:opacity;
    transform: translateZ(0);
    backface-visibility:hidden;
    pointer-events:none;
  }
  .stories-media img.show{ opacity:1; }

  .stories-fallback{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:72px;
    background: radial-gradient(ellipse at 50% 40%, var(--plum-soft), #14080e 72%);
    z-index:1;
  }
  .stories-fallback.on{ display:flex; }

  .stories-scrim{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      linear-gradient(180deg, rgba(20,8,15,0.58) 0%, rgba(20,8,15,0.12) 16%, transparent 30%),
      linear-gradient(180deg, transparent 46%, rgba(20,8,15,0.5) 76%, rgba(20,8,15,0.92) 100%);
  }

  .stories-copy{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:4;
    padding: 0 22px calc(28px + env(safe-area-inset-bottom));
    color: var(--cream);
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .stories-copy .big-em{
    font-size:28px;
    line-height:1;
    margin-bottom:8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }
  .stories-copy h2{
    margin:0;
    font-family: var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size: clamp(26px, 7vw, 36px);
    line-height:1.18;
    text-shadow: 0 2px 18px rgba(0,0,0,0.5);
    overflow-wrap:anywhere;
  }
  .stories-copy p{
    margin:10px 0 0;
    font-family: var(--font-display);
    font-style:italic;
    font-size:16px;
    line-height:1.4;
    color: var(--gold-soft);
    max-width: 28ch;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
  }

  .stories-end{
    position:absolute;
    inset:0;
    z-index:3;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 28px;
    background: radial-gradient(ellipse at 50% 38%, var(--plum-soft), #14080e 74%);
  }
  .stories-end.on{ display:flex; }
  .stories-end .heart{
    font-size:28px;
    color:#f3c9da;
    animation: heartbeat 2.6s ease-in-out infinite;
  }
  .stories-end h2{
    font-family: var(--font-script);
    font-weight:400;
    font-size: clamp(36px, 8vw, 52px);
    color: var(--cream);
    margin: 12px 0 0;
  }
  .stories-end p{
    font-family: var(--font-display);
    font-style:italic;
    color: var(--gold-soft);
    margin: 10px 0 0;
    font-size: 17px;
  }

  .hit{
    position:absolute;
    top:0; bottom:0;
    z-index:5;
    border:0;
    background:transparent;
    padding:0;
    -webkit-tap-highlight-color: transparent;
    cursor:pointer;
  }
  .hit-left{ left:0; width:32%; }
  .hit-right{ right:0; width:68%; }

  @media (min-width: 760px){
    .stories{
      padding:28px;
      align-items:center;
      background: rgba(12,4,8,0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .stories-frame{
      width: min(430px, 100%);
      height: min(860px, 100%);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(211,172,110,0.2);
    }
  }

  @media (max-width: 720px){
    .stage{
      flex-direction:column;
      justify-content:flex-start;
    }
    .title-wrap{
      position:relative;
      top:auto; left:auto;
      transform:none;
      flex-shrink:0;
      margin-top: 4px;
      margin-bottom: 6px;
    }
    .flower{
      width: min(84vw, calc(100dvh - 8.8rem));
      height: min(84vw, calc(100dvh - 8.8rem));
      margin: auto 0;
      flex-shrink:0;
    }
    .petal{
      width: 30%;
      height: 30%;
      border-radius: 0 40% 40% 40%;
      padding: 6px;
    }
    .petal-inner{ gap:4px; }
    .petal-inner .emoji{ font-size: 20px; }
    .petal-inner .label{ max-width: 7.8em; font-size: 11.5px; }
    .center-node{
      width: 30%;
      height: 30%;
      box-shadow: 0 0 0 5px rgba(211,172,110,0.12), 0 8px 28px rgba(0,0,0,0.4);
    }
  }

  @media (max-height: 520px){
    .stage{
      flex-direction:column;
      justify-content:flex-start;
    }
    .title-wrap{
      position:relative;
      top:auto; left:auto;
      transform:none;
      margin-bottom: 4px;
    }
    .title-wrap h1{ font-size: 28px; }
    .title-hint{ display:none; }
    .flower{
      width: min(58dvh, 52vw);
      height: min(58dvh, 52vw);
      margin: auto 0;
    }
    .petal-inner .label{ display:none; }
    .petal-inner .emoji{ font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .petal-float, .heart-float,
    .petal, .center-node, .center-node::after, .center-node .heart,
    .title-wrap h1, .title-wrap h1::after, .title-hint,
    .stories-end .heart{
      animation:none !important;
    }
    .petal, .center-node, .stories{ transition:none; }
    .petal{ opacity:1; transform: translate(-50%, -50%) rotate(var(--rot)); }
    .center-node{ opacity:1; transform: translate(-50%, -50%); }
    .heart-float{ display:none; }
    .stories-media img{ transition:none; }
    .seg.active .fill{ animation:none; transform: scaleX(0.2); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="title-wrap">
    <h1>Её вселенная</h1>
    <p class="title-hint">нажми на лепесток</p>
  </div>

  <div class="flower" id="flower">
    <div class="center-node">
      <div class="center-text">
        <div class="heart">❤</div>
        <div class="center-label">Менің<br>Қошақанм</div>
      </div>
    </div>
  </div>
</div>

<div class="stories" id="stories" aria-hidden="true">
  <div class="stories-frame" id="storiesFrame" role="dialog" aria-modal="true" aria-labelledby="storiesCatName">
    <div class="stories-progress" id="storiesProgress"></div>
    <div class="stories-head">
      <div class="stories-who">
        <span class="em" id="storiesCatEmoji">🌸</span>
        <span class="name" id="storiesCatName">Категория</span>
      </div>
      <button class="stories-close" id="storiesClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="stories-media" id="storiesMedia">
      <img id="storyImgA" alt="" draggable="false">
      <img id="storyImgB" alt="" draggable="false">
      <div class="stories-fallback" id="storiesFallback" aria-hidden="true"></div>
    </div>
    <div class="stories-scrim"></div>
    <div class="stories-copy" id="storiesCopy">
      <div class="big-em" id="storiesItemEmoji"></div>
      <h2 id="storiesTitle"></h2>
      <p id="storiesSub"></p>
    </div>
    <div class="stories-end" id="storiesEnd">
      <div class="heart">❤</div>
      <h2>Её вселенная</h2>
      <p>нажми, чтобы вернуться</p>
    </div>
    <button class="hit hit-left" id="hitLeft" aria-label="Назад"></button>
    <button class="hit hit-right" id="hitRight" aria-label="Дальше"></button>
  </div>
</div>

<script>
const petalColors = ['#f6c9dd','#f3d6e6','#eec7d8','#f1cfe2','#f8d9ea','#ecc3d6'];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ITEM_MS = reduceMotion ? 0 : 5500;
const NOTE_MS = reduceMotion ? 0 : 4500;

/* ========== КАРТИНКИ ==========
   Меняй только поле img — вставь полную ссылку в кавычки.
   Пример: img:'https://site.com/photo.jpg'
   Какой кадр: смотри комментарий справа или поле t.
   ================================= */
const categories = [
  {
    emoji:'🎀', title:'Чем любит заниматься',
    items:[
      {e:'😴', t:'поспать', img:'https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=1200&q=80'}, // поспать
      {e:'🚶‍♀️', t:'гулять', img:'https://static01.nyt.com/images/2023/06/13/well/02WELNL-AWE-WALKS/02WELNL-AWE-WALKS-mediumSquareAt3X.jpg'}, // гулять
      {e:'🎬', t:'дорамы и мультики', img:'https://rg.ru/uploads/images/2024/07/04/orig_br_1000_c98.jpg'}, // дорамы и мультики
      {e:'💎', t:'алмазная мозаика', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDz2BskV08iQZB1E9n_4PJ6DU87iDYobShL47ilKc0Mnz6vYFHC3pQO9Kn&s=10'}, // алмазная мозаика
      {e:'🎨', t:'картины по номерам', img:'https://cdn.api.kari.com/f/y8104020_002.jpg'}, // картины по номерам
      {e:'📸', t:'фото и видео', img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1200&q=80'}, // фото и видео
      {e:'📱', t:'тикток (смотреть/вести)', img:'https://img.magnific.com/free-vector/tiktok-banner-with-watercolor-splatter_69286-194.jpg?semt=ais_hybrid&w=740&q=80'}, // тикток
      {e:'☕', t:'быть бариста, варить кофе', img:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80'}, // бариста / кофе

const flower = document.getElementById('flower');
const n = categories.length;
const radiusPct = 27;

categories.forEach((cat, i)=>{
  const angle = (-90 + i * (360/n)) * Math.PI/180;
  const rot = i * (360/n);

  const btn = document.createElement('button');
  btn.className = 'petal';
  btn.style.setProperty('--x', `${(Math.cos(angle) * radiusPct).toFixed(2)}%`);
  btn.style.setProperty('--y', `${(Math.sin(angle) * radiusPct).toFixed(2)}%`);
  btn.style.setProperty('--rot', `${rot}deg`);
  btn.style.setProperty('--i', i);
  btn.style.background = `linear-gradient(135deg, ${petalColors[i % petalColors.length]}, #ffffff)`;
  btn.setAttribute('aria-label', cat.title);

  const inner = document.createElement('div');
  inner.className = 'petal-inner';
  inner.innerHTML = `<div class="emoji">${cat.emoji}</div><div class="label">${cat.title}</div>`;
  btn.appendChild(inner);

  btn.addEventListener('click', ()=> openStories(i));
  flower.appendChild(btn);
});

const stage = document.getElementById('stage');
for(let i=0;i<7;i++){
  const p = document.createElement('div');
  p.className = 'petal-float';
  p.style.left = (8 + Math.random()*84) + '%';
  p.style.animationDelay = (Math.random()*18) + 's';
  p.style.animationDuration = (14 + Math.random()*10) + 's';
  stage.appendChild(p);
}
['♡','❤','♡','♡','❤'].forEach((mark, i)=>{
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.textContent = mark;
  h.style.left = (12 + i * 18 + Math.random()*8) + '%';
  h.style.fontSize = (11 + Math.random()*8) + 'px';
  h.style.animationDelay = (i * 2.4 + Math.random()) + 's';
  h.style.animationDuration = (14 + Math.random()*8) + 's';
  stage.appendChild(h);
});

const stories = document.getElementById('stories');
const storiesProgress = document.getElementById('storiesProgress');
const storiesCatEmoji = document.getElementById('storiesCatEmoji');
const storiesCatName = document.getElementById('storiesCatName');
const storiesClose = document.getElementById('storiesClose');
const storiesCopy = document.getElementById('storiesCopy');
const storiesItemEmoji = document.getElementById('storiesItemEmoji');
const storiesTitle = document.getElementById('storiesTitle');
const storiesSub = document.getElementById('storiesSub');
const storiesEnd = document.getElementById('storiesEnd');
const storiesFallback = document.getElementById('storiesFallback');
const imgA = document.getElementById('storyImgA');
const imgB = document.getElementById('storyImgB');
const hitLeft = document.getElementById('hitLeft');
const hitRight = document.getElementById('hitRight');

let catIndex = 0;
let slideIndex = 0;
let buf = 0;
let imgGen = 0;
let skipClick = false;
let holdTimer = 0;
let startX = 0;
let startY = 0;
let holding = false;
let onEnd = false;

function slidesOf(cat){
  const slides = cat.items.map((item)=>({kind:'item', ...item, dur: ITEM_MS}));
  if(cat.note){
    slides.push({kind:'note', e:'', t: cat.note, img: cat.items[cat.items.length-1].img, dur: NOTE_MS});
  }
  return slides;
}

function currentSlides(){
  return slidesOf(categories[catIndex]);
}

function openStories(index){
  catIndex = index;
  slideIndex = 0;
  onEnd = false;
  stories.classList.add('open');
  stories.classList.remove('paused');
  stories.setAttribute('aria-hidden', 'false');
  stage.setAttribute('aria-hidden', 'true');
  renderSlide(true);
  storiesClose.focus();
}

function closeStories(){
  stories.classList.remove('open', 'paused');
  stories.setAttribute('aria-hidden', 'true');
  stage.removeAttribute('aria-hidden');
  onEnd = false;
  imgA.classList.remove('show');
  imgB.classList.remove('show');
  imgA.removeAttribute('src');
  imgB.removeAttribute('src');
  imgA.removeAttribute('data-src');
  imgB.removeAttribute('data-src');
}

function renderProgress(slides){
  if(storiesProgress.childElementCount !== slides.length){
    storiesProgress.replaceChildren();
    slides.forEach(()=>{
      const seg = document.createElement('div');
      seg.className = 'seg';
      const fill = document.createElement('div');
      fill.className = 'fill';
      seg.appendChild(fill);
      storiesProgress.appendChild(seg);
    });
  }
  [...storiesProgress.children].forEach((seg, i)=>{
    const fill = seg.firstElementChild;
    const nextClass = 'seg' + (i < slideIndex ? ' done' : i === slideIndex ? ' active' : '');
    seg.className = 'seg';
    if(i === slideIndex && !reduceMotion && !onEnd){
      fill.style.setProperty('--dur', (slides[i].dur || ITEM_MS) + 'ms');
      void fill.offsetWidth;
    } else {
      fill.style.removeProperty('--dur');
    }
    seg.className = nextClass;
  });
}

function showImage(src, emoji, onReady){
  const shown = buf === 0 ? imgA : imgB;
  if(shown.classList.contains('show') && shown.getAttribute('data-src') === src){
    if(onReady) onReady();
    return;
  }

  const next = 1 - buf;
  const incoming = next === 0 ? imgA : imgB;
  const outgoing = shown;
  const gen = ++imgGen;

  const reveal = ()=>{
    if(gen !== imgGen) return;
    incoming.classList.add('show');
    outgoing.classList.remove('show');
    buf = next;
    storiesFallback.classList.remove('on');
    if(onReady) onReady();
  };

  incoming.alt = emoji || '';
  incoming.setAttribute('data-src', src);
  incoming.onerror = ()=>{
    if(gen !== imgGen) return;
    incoming.classList.remove('show');
    storiesFallback.textContent = emoji || '🌸';
    storiesFallback.classList.add('on');
    outgoing.classList.remove('show');
    buf = next;
    if(onReady) onReady();
  };

  const ready = ()=>{
    if(gen !== imgGen) return;
    if(incoming.decode) incoming.decode().then(reveal, reveal);
    else reveal();
  };

  if(incoming.getAttribute('src') === src && incoming.complete && incoming.naturalWidth){
    ready();
    return;
  }
  incoming.onload = ready;
  incoming.src = src;
}

function preload(url){
  if(!url) return;
  const im = new Image();
  im.src = url;
}

function renderSlide(rebuild){
  const cat = categories[catIndex];
  const slides = currentSlides();
  const slide = slides[slideIndex];

  storiesCatEmoji.textContent = cat.emoji;
  storiesCatName.textContent = cat.title;
  storiesEnd.classList.remove('on');
  storiesCopy.style.display = '';
  hitLeft.style.display = '';
  hitRight.style.display = '';

  if(rebuild !== false) renderProgress(slides);

  const applyCopy = ()=>{
    if(slide.kind === 'note'){
      storiesItemEmoji.textContent = '';
      storiesTitle.textContent = slide.t;
      storiesSub.textContent = '';
    } else {
      storiesItemEmoji.textContent = slide.e;
      storiesTitle.textContent = slide.t;
      storiesSub.textContent = '';
    }
    storiesCopy.style.opacity = '1';
  };

  storiesCopy.style.opacity = '0';
  showImage(slide.img, slide.e || cat.emoji, applyCopy);

  const ahead = [];
  if(slides[slideIndex + 1]) ahead.push(slides[slideIndex + 1].img);
  if(slides[slideIndex + 2]) ahead.push(slides[slideIndex + 2].img);
  else if(catIndex < n - 1){
    const nxt = categories[catIndex + 1].items;
    if(nxt[0]) ahead.push(nxt[0].img);
    if(nxt[1]) ahead.push(nxt[1].img);
  }
  ahead.forEach(preload);
}

function showEnd(){
  onEnd = true;
  storiesProgress.replaceChildren();
  storiesCatEmoji.textContent = '❤';
  storiesCatName.textContent = 'Её вселенная';
  storiesCopy.style.display = 'none';
  storiesEnd.classList.add('on');
  imgA.classList.remove('show');
  imgB.classList.remove('show');
  storiesFallback.classList.remove('on');
}

function next(){
  if(onEnd){ closeStories(); return; }
  const slides = currentSlides();
  if(slideIndex < slides.length - 1){
    slideIndex += 1;
    renderSlide(true);
    return;
  }
  if(catIndex < n - 1){
    catIndex += 1;
    slideIndex = 0;
    renderSlide(true);
    return;
  }
  showEnd();
}

function prev(){
  if(onEnd){
    onEnd = false;
    catIndex = n - 1;
    slideIndex = currentSlides().length - 1;
    renderSlide(true);
    return;
  }
  if(slideIndex > 0){
    slideIndex -= 1;
    renderSlide(true);
    return;
  }
  if(catIndex > 0){
    catIndex -= 1;
    slideIndex = currentSlides().length - 1;
    renderSlide(true);
    return;
  }
  closeStories();
}

storiesProgress.addEventListener('animationend', (e)=>{
  if(e.target.classList.contains('fill') && stories.classList.contains('open') && !holding){
    next();
  }
});

storiesClose.addEventListener('click', closeStories);
hitLeft.addEventListener('click', ()=>{
  if(skipClick){ skipClick = false; return; }
  prev();
});
hitRight.addEventListener('click', ()=>{
  if(skipClick){ skipClick = false; return; }
  next();
});

const frame = document.getElementById('storiesFrame');
frame.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('.stories-close')) return;
  startX = e.clientX;
  startY = e.clientY;
  holding = false;
  holdTimer = window.setTimeout(()=>{
    holding = true;
    stories.classList.add('paused');
  }, 180);
});
function endHold(e){
  window.clearTimeout(holdTimer);
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if(holding){
    holding = false;
    skipClick = true;
    stories.classList.remove('paused');
    return;
  }
  if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)){
    skipClick = true;
    dx < 0 ? next() : prev();
  }
}
frame.addEventListener('pointerup', endHold);
frame.addEventListener('pointercancel', ()=>{
  window.clearTimeout(holdTimer);
  holding = false;
  stories.classList.remove('paused');
});

document.addEventListener('keydown', (e)=>{
  if(!stories.classList.contains('open')) return;
  if(e.key === 'Escape') closeStories();
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});
</script>
